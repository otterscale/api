---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: moduletemplates.module.otterscale.io
spec:
  group: module.otterscale.io
  names:
    categories:
    - otterscale
    kind: ModuleTemplate
    listKind: ModuleTemplateList
    plural: moduletemplates
    singular: moduletemplate
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.namespace
      name: Namespace
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ModuleTemplate is the Schema for the moduletemplates API.
          A ModuleTemplate defines a reusable platform module blueprint containing either
          a Helm chart or Kustomization specification. Users create Module CRs
          to instantiate and deploy modules from these templates.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired behavior of the ModuleTemplate.
            properties:
              description:
                description: Description is a human-readable description of the module
                  template.
                maxLength: 1024
                type: string
              helmChart:
                description: |-
                  HelmChart defines a Helm chart-based module.
                  The operator downloads the chart and manages the Helm release directly.
                  Mutually exclusive with Kustomization (enforced via CEL).
                type: object
                x-kubernetes-preserve-unknown-fields: true
              kustomization:
                description: |-
                  Kustomization defines a Kustomize-based module.
                  The operator clones the source, builds the kustomization, and applies
                  the manifests using server-side apply.
                  Mutually exclusive with HelmChart (enforced via CEL).
                type: object
                x-kubernetes-preserve-unknown-fields: true
              namespace:
                description: |-
                  Namespace is the default target namespace where resources will be
                  deployed when a Module is instantiated from this template.
                maxLength: 63
                minLength: 1
                pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?)$
                type: string
            required:
            - namespace
            type: object
            x-kubernetes-validations:
            - message: exactly one of helmChart or kustomization must be set
              rule: (has(self.helmChart) && !has(self.kustomization)) || (!has(self.helmChart)
                && has(self.kustomization))
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
