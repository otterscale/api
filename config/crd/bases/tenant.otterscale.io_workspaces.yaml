                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              limitRangeRef:
                description: LimitRangeRef is a reference to the LimitRange managed
                  by this Workspace.
                properties:
                  name:
                    description: Name is the name of the referenced resource.
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of the referenced resource.
                      Empty for cluster-scoped resources.
                    type: string
                required:
                - name
                type: object
              namespaceRef:
                description: NamespaceRef is a reference to the Namespace managed
                  by this Workspace.
                properties:
                  name:
                    description: Name is the name of the referenced resource.
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of the referenced resource.
                      Empty for cluster-scoped resources.
                    type: string
                required:
                - name
                type: object
              networkPolicyRef:
                description: NetworkPolicyRef is a reference to the NetworkPolicy
                  enforcing network isolation.
                properties:
                  name:
                    description: Name is the name of the referenced resource.
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of the referenced resource.
                      Empty for cluster-scoped resources.
                    type: string
                required:
                - name
                type: object
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the controller.
                  It corresponds to the Workspace's generation, which is updated on mutation by the API Server.
                  This allows clients to determine whether the controller has processed the latest spec changes.
                format: int64
                type: integer
              peerAuthenticationRef:
                description: PeerAuthenticationRef is a reference to the Istio PeerAuthentication
