---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: artifacts.model.otterscale.io
spec:
  group: model.otterscale.io
  names:
    categories:
    - otterscale
    kind: Artifact
    listKind: ArtifactList
    plural: artifacts
    singular: artifact
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.target.registry
      name: Registry
      type: string
    - jsonPath: .spec.target.repository
      name: Repository
      type: string
    - jsonPath: .status.digest
      name: Digest
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Artifact is the Schema for the artifacts API.
          An Artifact declares intent to import a model from a source (e.g. HuggingFace),
          package it as an OCI artifact (ModelPack or ModelKit format), and push it to an
          OCI-compliant registry. The controller creates a Kubernetes Job to execute the
          import/pack/push pipeline and reports the resulting digest back to the status.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired artifact.
            properties:
              format:
                default: ModelPack
                description: Format specifies the OCI artifact packaging format.
                enum:
                - ModelPack
                - ModelKit
                type: string
              source:
                description: Source defines where to fetch the model from.
                properties:
                  huggingFace:
                    description: HuggingFace specifies a HuggingFace Hub repository
                      as the model source.
                    properties:
                      model:
                        description: |-
                          Model is the HuggingFace model identifier (e.g. "microsoft/phi-4", "facebook/opt-125m").
                          Must contain only alphanumerics, dots, underscores, hyphens, and slashes.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-zA-Z0-9][a-zA-Z0-9._/-]*$
                        type: string
                      revision:
                        description: |-
                          Revision pins a specific branch, tag, or commit hash.
                          If not specified, the default branch is used.
                          Must contain only alphanumerics, dots, underscores, hyphens, and slashes.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-zA-Z0-9._/-]*$
                        type: string
                      tokenSecretRef:
                        description: |-
                          TokenSecretRef references a Secret containing the HuggingFace access token.
                          Required for private or gated repositories.
                        properties:
                          key:
                            description: Key is the key within the Secret data. If
                              omitted, defaults to "token".
                            type: string
                          name:
                            description: Name is the name of the Secret in the same
                              namespace as the Artifact.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - model
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one source must be specified
                  rule: '[has(self.huggingFace)].filter(x, x).size() == 1'
              storage:
                description: |-
                  Storage configures the temporary PVC used during the import/pack/push pipeline.
                  The PVC is automatically cleaned up after the job completes.
                properties:
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      Size is the requested PVC storage capacity (e.g. "100Gi").
                      Should be at least 2x the expected model size to accommodate both
                      the downloaded files and the packed artifact.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: |-
                      StorageClassName overrides the cluster default StorageClass.
                      If not specified, the cluster default StorageClass is used.
                    type: string
                required:
                - size
                type: object
              target:
                description: Target defines the OCI registry destination for the packaged
                  artifact.
                properties:
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef references a Secret containing OCI registry credentials.
                      The Secret must contain "username" and "password" keys.
                    properties:
                      name:
                        description: Name is the name of the Secret in the same namespace
                          as the Artifact.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  insecure:
                    description: |-
                      Insecure uses an unencrypted connection to the registry instead of TLS.
                      Only use for development or air-gapped environments.
                    type: boolean
                  registry:
                    description: Registry is the OCI registry host, optionally with
                      port (e.g. "ghcr.io", "registry.local:5001").
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-zA-Z0-9][a-zA-Z0-9._/:-]*$
                    type: string
                  repository:
                    description: |-
                      Repository is the OCI repository path within the registry (e.g. "myorg/models/phi-4", "facebook/opt-125m").
                      Must not include the registry host. Must contain only alphanumerics, dots, underscores, hyphens, and slashes.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-zA-Z0-9][a-zA-Z0-9._/-]*$
                    type: string
                  tag:
                    description: |-
                      Tag is the image tag to push. Defaults to "latest" if not specified.
                      Must contain only alphanumerics, dots, underscores, and hyphens.
                    maxLength: 128
                    minLength: 1
                    pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
                    type: string
                required:
                - registry
                - repository
                type: object
            required:
            - source
            - storage
            - target
            type: object
          status:
            description: Status represents the current state of the artifact pipeline.
            properties:
              completionTime:
                description: CompletionTime is the timestamp when the most recent
                  job completed (succeeded or failed).
                format: date-time
                type: string
              conditions:
                description: Conditions store the status conditions of the Artifact.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              digest:
                description: |-
                  Digest is the OCI manifest digest of the pushed artifact (e.g. "sha256:abc123...").
                  Only populated when Phase is Succeeded.
                type: string
              jobRef:
                description: JobRef references the most recently created Job for this
                  artifact.
                properties:
                  name:
                    description: Name is the name of the referenced resource.
                    type: string
                  namespace:
                    description: Namespace is the namespace of the referenced resource.
                    type: string
                required:
                - name
                type: object
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: Phase is the high-level summary of the artifact lifecycle.
                type: string
              reference:
                description: Reference is the full OCI reference of the pushed artifact
                  including tag.
                type: string
              startTime:
                description: StartTime is the timestamp when the most recent job was
                  created.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
