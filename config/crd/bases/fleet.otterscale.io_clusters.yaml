---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clusters.fleet.otterscale.io
spec:
  group: fleet.otterscale.io
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.controlPlaneReady
      name: CP Ready
      type: boolean
    - jsonPath: .status.readyWorkers
      name: Workers
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Cluster is the Schema for the clusters API.
          A Cluster represents a Talos Linux Kubernetes cluster provisioned on bare metal
          via Metal3 BareMetalHost resources.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired behavior of the Cluster.
            properties:
              clusterNetwork:
                description: ClusterNetwork configures pod, service, and DNS networking.
                properties:
                  dnsDomain:
                    default: cluster.local
                    description: 'DNSDomain is the DNS domain used for internal cluster
                      DNS (default: cluster.local).'
                    type: string
                  podSubnets:
                    description: PodSubnets is the list of CIDR ranges for pod IP
                      allocation.
                    items:
                      type: string
                    minItems: 1
                    type: array
                  serviceSubnets:
                    description: ServiceSubnets is the list of CIDR ranges for service
                      ClusterIP allocation.
                    items:
                      type: string
                    minItems: 1
                    type: array
                type: object
              controlPlaneConfig:
                description: |-
                  ControlPlaneConfig defines how Talos machine configs are produced for control plane nodes.
                  Individual Machines may override this via their own TalosConfig field.
                properties:
                  configPatches:
                    description: |-
                      ConfigPatches is a list of RFC 6902 JSON patches applied to the generated config.
                      Ignored when GenerateType is "none".
                    items:
                      description: ConfigPatch defines a single RFC 6902 JSON patch
                        operation.
                      properties:
                        op:
                          description: Op is the patch operation (add, remove, replace,
                            move, copy, test).
                          enum:
                          - add
                          - remove
                          - replace
                          - move
                          - copy
                          - test
                          type: string
                        path:
                          description: Path is the JSON pointer to the target location.
                          minLength: 1
                          type: string
                        value:
                          description: Value is the value to use in the patch operation
                            (required for add/replace/test).
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                      required:
                      - op
                      - path
                      type: object
                    type: array
                  data:
                    description: |-
                      Data is the raw Talos machine configuration YAML.
                      Required when GenerateType is "none"; ignored otherwise.
                    type: string
                  generateType:
                    description: |-
                      GenerateType determines how the Talos machine config is produced.
                      "controlplane" auto-generates a control plane config from cluster parameters.
                      "worker" auto-generates a worker (join) config from cluster parameters.
                      "none" expects the user to supply a complete config in the Data field.
                      When omitted, the controller defaults based on the Machine role.
                    enum:
                    - controlplane
                    - worker
                    - none
                    type: string
                type: object
              controlPlaneEndpoint:
                description: ControlPlaneEndpoint is the API server endpoint (typically
                  a VIP or load balancer).
                properties:
                  host:
                    description: Host is the hostname or IP address of the API server.
                    minLength: 1
                    type: string
                  port:
                    default: 6443
                    description: Port is the port number of the API server.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                required:
                - host
                type: object
              kubernetesVersion:
                description: KubernetesVersion is the target Kubernetes version (e.g.,
                  "v1.32.0").
                pattern: ^v\d+\.\d+\.\d+$
                type: string
              talosImage:
                description: TalosImage specifies the Talos OS image written to each
                  BareMetalHost.
                properties:
                  checksum:
                    description: Checksum is the image checksum or a URL pointing
                      to a checksum file.
                    minLength: 1
                    type: string
                  checksumType:
                    default: sha256
                    description: ChecksumType is the algorithm used for the checksum
                      (sha256, sha512, md5, or auto).
                    enum:
                    - sha256
                    - sha512
                    - md5
                    - auto
                    type: string
                  format:
                    default: raw
                    description: Format is the disk image format (raw, qcow2, or live-iso).
                    enum:
                    - raw
                    - qcow2
                    - live-iso
                    type: string
                  url:
                    description: URL is the location of the OS image (e.g., HTTP server
                      hosting Talos raw image).
                    minLength: 1
                    type: string
                required:
                - checksum
                - url
                type: object
              talosVersion:
                description: TalosVersion is the Talos OS version to use for config
                  generation (e.g., "v1.9").
                pattern: ^v\d+\.\d+(\.\d+)?$
                type: string
              workerConfig:
                description: |-
                  WorkerConfig defines how Talos machine configs are produced for worker nodes.
                  When omitted, defaults to generateType "worker" which auto-generates a join config.
                  Individual Machines may override this via their own TalosConfig field.
                properties:
                  configPatches:
                    description: |-
                      ConfigPatches is a list of RFC 6902 JSON patches applied to the generated config.
                      Ignored when GenerateType is "none".
                    items:
                      description: ConfigPatch defines a single RFC 6902 JSON patch
                        operation.
                      properties:
                        op:
                          description: Op is the patch operation (add, remove, replace,
                            move, copy, test).
                          enum:
                          - add
                          - remove
                          - replace
                          - move
                          - copy
                          - test
                          type: string
                        path:
                          description: Path is the JSON pointer to the target location.
                          minLength: 1
                          type: string
                        value:
                          description: Value is the value to use in the patch operation
                            (required for add/replace/test).
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                      required:
                      - op
                      - path
                      type: object
                    type: array
                  data:
                    description: |-
                      Data is the raw Talos machine configuration YAML.
                      Required when GenerateType is "none"; ignored otherwise.
                    type: string
                  generateType:
                    description: |-
                      GenerateType determines how the Talos machine config is produced.
                      "controlplane" auto-generates a control plane config from cluster parameters.
                      "worker" auto-generates a worker (join) config from cluster parameters.
                      "none" expects the user to supply a complete config in the Data field.
                      When omitted, the controller defaults based on the Machine role.
                    enum:
                    - controlplane
                    - worker
                    - none
                    type: string
                type: object
            required:
            - controlPlaneEndpoint
            - kubernetesVersion
            - talosImage
            - talosVersion
            type: object
          status:
            description: Status represents the current information about the Cluster.
            properties:
              conditions:
                description: Conditions store the status conditions of the Cluster.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              controlPlaneReady:
                description: ControlPlaneReady is true when all control plane Machines
                  are bootstrapped and running.
                type: boolean
              initialized:
                description: |-
                  Initialized is true once the first control plane node has been bootstrapped
                  and etcd has been initialized.
                type: boolean
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: Phase is the high-level summary of the cluster lifecycle.
                enum:
                - Pending
                - Provisioning
                - Provisioned
                - Ready
                - Failed
                - Deleting
                type: string
              readyWorkers:
                description: ReadyWorkers is the count of worker Machines that are
                  ready.
                format: int32
                type: integer
              secretsRef:
                description: SecretsRef references the Secret containing the Talos
                  secrets bundle.
                properties:
                  name:
                    description: Name is the name of the referenced resource.
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of the referenced resource.
                      Empty for cluster-scoped resources.
                    type: string
                required:
                - name
                type: object
              talosconfigRef:
                description: TalosconfigRef references the Secret containing the talosconfig
                  client configuration.
                properties:
                  name:
                    description: Name is the name of the referenced resource.
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of the referenced resource.
                      Empty for cluster-scoped resources.
                    type: string
                required:
                - name
                type: object
              totalWorkers:
                description: TotalWorkers is the total count of worker Machines.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
