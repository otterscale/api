---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: machines.fleet.otterscale.io
spec:
  group: fleet.otterscale.io
  names:
    categories:
    - otterscale
    kind: Machine
    listKind: MachineList
    plural: machines
    singular: machine
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef
      name: Cluster
      type: string
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Machine is the Schema for the machines API.
          A Machine represents a single bare metal node in a Talos cluster,
          backed by a Metal3 BareMetalHost.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired behavior of the Machine.
            properties:
              bareMetalHostRef:
                description: BareMetalHostRef references the Metal3 BareMetalHost
                  that backs this Machine.
                properties:
                  name:
                    description: Name is the name of the BareMetalHost.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace is the namespace of the BareMetalHost.
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
                x-kubernetes-validations:
                - message: bareMetalHostRef is immutable
                  rule: self == oldSelf
              bootstrap:
                description: |-
                  Bootstrap indicates whether this Machine is the initial bootstrap node
                  responsible for initializing etcd. Exactly one control plane Machine per
                  Cluster should have this set to true. Must not be set on worker Machines.
                type: boolean
              clusterRef:
                description: ClusterRef is the name of the Cluster this Machine belongs
                  to.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: clusterRef is immutable
                  rule: self == oldSelf
              role:
                description: Role defines whether this Machine is a control plane
                  or worker node.
                enum:
                - controlplane
                - worker
                type: string
                x-kubernetes-validations:
                - message: role is immutable
                  rule: self == oldSelf
              talosConfig:
                description: |-
                  TalosConfig overrides the Cluster-level default config for this Machine.
                  When omitted, the fallback is role-aware: control plane Machines use
                  the Cluster's ControlPlaneConfig, worker Machines use the Cluster's WorkerConfig.
                properties:
                  configPatches:
                    description: |-
                      ConfigPatches is a list of RFC 6902 JSON patches applied to the generated config.
                      Ignored when GenerateType is "none".
                    items:
                      description: ConfigPatch defines a single RFC 6902 JSON patch
                        operation.
                      properties:
                        op:
                          description: Op is the patch operation (add, remove, replace,
                            move, copy, test).
                          enum:
                          - add
                          - remove
                          - replace
                          - move
                          - copy
                          - test
                          type: string
                        path:
                          description: Path is the JSON pointer to the target location.
                          minLength: 1
                          type: string
                        value:
                          description: Value is the value to use in the patch operation
                            (required for add/replace/test).
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                      required:
                      - op
                      - path
                      type: object
                    type: array
                  data:
                    description: |-
                      Data is the raw Talos machine configuration YAML.
                      Required when GenerateType is "none"; ignored otherwise.
                    type: string
                  generateType:
                    description: |-
                      GenerateType determines how the Talos machine config is produced.
                      "controlplane" auto-generates a control plane config from cluster parameters.
                      "worker" auto-generates a worker (join) config from cluster parameters.
                      "none" expects the user to supply a complete config in the Data field.
                      When omitted, the controller defaults based on the Machine role.
                    enum:
                    - controlplane
                    - worker
                    - none
                    type: string
                type: object
            required:
            - bareMetalHostRef
            - clusterRef
            - role
            type: object
            x-kubernetes-validations:
            - message: worker nodes cannot be bootstrap nodes
              rule: '!(self.role == ''worker'' && self.bootstrap)'
          status:
            description: Status represents the current information about the Machine.
            properties:
              addresses:
                description: Addresses contains the addresses reported by the BareMetalHost
                  hardware inspection.
                items:
                  description: MachineAddress contains information about a machine's
                    address.
                  properties:
                    address:
                      description: Address is the actual address value.
                      type: string
                    type:
                      description: Type is the type of the address (InternalIP, ExternalIP,
                        Hostname).
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
              bootstrapDataSecretRef:
                description: BootstrapDataSecretRef references the Secret containing
                  the Talos machine config.
                properties:
                  name:
                    description: Name is the name of the referenced resource.
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of the referenced resource.
                      Empty for cluster-scoped resources.
                    type: string
                required:
                - name
                type: object
              bootstrapReady:
                description: BootstrapReady is true when the Talos bootstrap has completed.
                type: boolean
              conditions:
                description: Conditions store the status conditions of the Machine.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              infrastructureReady:
                description: InfrastructureReady is true when the BareMetalHost has
                  finished provisioning.
                type: boolean
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: Phase is the high-level summary of the machine lifecycle.
                enum:
                - Pending
                - Provisioning
                - Provisioned
                - Bootstrapping
                - Running
                - Failed
                - Deleting
                type: string
              ready:
                description: Ready is true when the Machine is fully bootstrapped
                  and the node is healthy.
                type: boolean
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
