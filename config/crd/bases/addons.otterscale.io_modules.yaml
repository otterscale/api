---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: modules.addons.otterscale.io
spec:
  group: addons.otterscale.io
  names:
    kind: Module
    listKind: ModuleList
    plural: modules
    singular: module
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.templateRef
      name: Template
      type: string
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="UpgradeAvailable")].status
      name: Outdated
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Module is the Schema for the modules API.
          A Module represents an installed platform addon instantiated from a ModuleTemplate.
          The controller manages the underlying Helm release or Kustomization directly
          and reflects its status back to the Module.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired behavior of the Module.
            properties:
              approvedTemplateGeneration:
                description: |-
                  ApprovedTemplateGeneration is the ModuleTemplate generation that has been
                  approved for deployment. When the referenced ModuleTemplate's generation
                  exceeds this value, the controller will not apply changes until this field
                  is updated to match or exceed the new generation.

                  Leave unset (nil) to auto-approve all template changes (legacy behavior).
                  Set explicitly to enable manual upgrade approval.
                format: int64
                type: integer
              namespace:
                description: |-
                  Namespace overrides the default target namespace defined in the ModuleTemplate.
                  If not specified, the namespace from the ModuleTemplate is used.
                maxLength: 63
                minLength: 1
                pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?)$
                type: string
              templateRef:
                description: |-
                  TemplateRef is the name of the ModuleTemplate to instantiate.
                  This field is immutable after creation.
                maxLength: 253
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: templateRef is immutable
                  rule: self == oldSelf
              values:
                description: |-
                  Values overrides the default Helm chart values for Helm-based modules.
                  Only applicable when the referenced ModuleTemplate uses a HelmChart template.
                  Ignored for Kustomization-based modules.
                type: object
                x-kubernetes-preserve-unknown-fields: true
            required:
            - templateRef
            type: object
          status:
            description: Status represents the current information about the Module.
            properties:
              appliedTemplateGeneration:
                description: |-
                  AppliedTemplateGeneration is the ModuleTemplate generation that was last
                  successfully applied. The controller uses this to detect whether a
                  template upgrade is pending.
                format: int64
                type: integer
              availableTemplateGeneration:
                description: |-
                  AvailableTemplateGeneration is the latest generation of the referenced
                  ModuleTemplate. When this exceeds AppliedTemplateGeneration, an upgrade
                  is available.
                format: int64
                type: integer
              conditions:
                description: Conditions store the status conditions of the Module
                  (e.g., Ready, UpgradeAvailable).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              helmRelease:
                description: |-
                  HelmRelease captures the observed state of the Helm release
                  when the Module is backed by a HelmChart template.
                properties:
                  chartVersion:
                    description: ChartVersion is the version of the currently deployed
                      Helm chart.
                    type: string
                  revision:
                    description: Revision is the Helm release revision number.
                    type: integer
                  status:
                    description: Status is the Helm release status (e.g. deployed,
                      failed, pending-upgrade).
                    enum:
                    - unknown
                    - deployed
                    - uninstalled
                    - superseded
                    - failed
                    - uninstalling
                    - pending-install
                    - pending-upgrade
                    - pending-rollback
                    type: string
                  valuesChecksum:
                    description: |-
                      ValuesChecksum is a SHA-256 hash of the rendered values used for
                      the most recent install or upgrade, enabling change detection.
                    type: string
                type: object
              inventory:
                description: |-
                  Inventory tracks the Kubernetes resources managed by this Module.
                  Used for garbage collection (pruning) of resources that are no longer
                  part of the desired state.
                items:
                  description: |-
                    InventoryEntry records the identity of a single Kubernetes resource
                    that was applied as part of a Module reconciliation. Used for
                    garbage-collecting resources that are no longer part of the desired state.
                  properties:
                    id:
                      description: |-
                        ID uniquely identifies the resource in the format
                        "<namespace>_<name>_<group>_<kind>".
                      type: string
                    version:
                      description: Version is the API version of the resource (e.g.
                        "v1", "apps/v1").
                      type: string
                  required:
                  - id
                  - version
                  type: object
                type: array
              kustomization:
                description: |-
                  Kustomization captures the observed state of the Kustomize-based
                  deployment when the Module is backed by a Kustomization template.
                properties:
                  lastAppliedRevision:
                    description: |-
                      LastAppliedRevision is the Git commit SHA that was last successfully
                      built and applied to the cluster.
                    type: string
                  lastAttemptedRevision:
                    description: |-
                      LastAttemptedRevision is the Git commit SHA that was last attempted
                      (may differ from LastAppliedRevision on failure).
                    type: string
                type: object
              namespace:
                description: |-
                  Namespace is the resolved target namespace where resources are deployed.
                  It reflects the effective namespace (Module override or ModuleTemplate default).
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the controller.
                  It corresponds to the Module's generation, which is updated on mutation by the API Server.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
