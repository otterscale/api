---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: moduleclasses.module.otterscale.io
spec:
  group: module.otterscale.io
  names:
    kind: ModuleClass
    listKind: ModuleClassList
    plural: moduleclasses
    singular: moduleclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.namespace
      name: Namespace
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ModuleClass is the Schema for the moduleclasses API.
          A ModuleClass defines a reusable platform module blueprint containing either
          a Helm chart or Kustomization specification. Users create Module CRs
          to instantiate and deploy modules from these classes.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired behavior of the ModuleClass.
            properties:
              description:
                description: Description is a human-readable description of the module
                  class.
                maxLength: 1024
                type: string
              helmChart:
                description: |-
                  HelmChart defines a Helm chart-based module.
                  The operator downloads the chart and manages the Helm release directly.
                  Mutually exclusive with Kustomization (enforced via CEL).
                properties:
                  chart:
                    description: Chart is the name of the Helm chart within the repository.
                    minLength: 1
                    type: string
                  createNamespace:
                    description: |-
                      CreateNamespace instructs the operator to create the target namespace
                      before installing the chart, if it does not already exist.
                    type: boolean
                  interval:
                    description: Interval at which the operator re-reconciles this
                      Helm release.
                    type: string
                  maxHistory:
                    description: |-
                      MaxHistory limits the number of Helm release revisions saved.
                      Defaults to 10 if not specified.
                    format: int32
                    minimum: 0
                    type: integer
                  releaseName:
                    description: |-
                      ReleaseName overrides the Helm release name.
                      Defaults to the Module name if not specified.
                    maxLength: 53
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  repoURL:
                    description: |-
                      RepoURL is the URL of the Helm chart repository.
                      Supports HTTP/HTTPS Helm repositories and OCI registries (oci://).
                    minLength: 1
                    pattern: ^(https?://|oci://).+$
                    type: string
                  secretRef:
                    description: |-
                      SecretRef references a Secret in the Module's resolved namespace
                      containing credentials for the Helm repository.
                      Supported keys: username, password (Basic Auth), caFile, certFile, keyFile (TLS).
                    properties:
                      name:
                        description: Name is the name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  timeout:
                    description: |-
                      Timeout is the maximum duration for any single Helm operation.
                      Defaults to 5m if not specified.
                    type: string
                  upgrade:
                    description: Upgrade configures the Helm upgrade strategy.
                    properties:
                      cleanupOnFail:
                        description: CleanupOnFail rolls back changes on upgrade failure.
                        type: boolean
                      enableRollback:
                        description: EnableRollback triggers an automatic rollback
                          when an upgrade fails.
                        type: boolean
                      force:
                        description: Force forces resource updates through a replacement
                          strategy.
                        type: boolean
                      maxRetries:
                        description: |-
                          MaxRetries is the maximum number of retries before marking the release as failed.
                          Defaults to 0 (no retries).
                        format: int32
                        minimum: 0
                        type: integer
                    type: object
                  values:
                    description: |-
                      Values holds the default Helm chart values as arbitrary JSON.
                      Module.Spec.Values can override these on a per-instance basis.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  version:
                    description: |-
                      Version is the exact chart version to install (e.g. "1.2.3").
                      If empty, the latest version is used.
                    type: string
                required:
                - chart
                - interval
                - repoURL
                type: object
              kustomization:
                description: |-
                  Kustomization defines a Kustomize-based module.
                  The operator clones the source, builds the kustomization, and applies
                  the manifests using server-side apply.
                  Mutually exclusive with HelmChart (enforced via CEL).
                properties:
                  force:
                    description: |-
                      Force instructs the operator to recreate resources that have
                      immutable field changes, instead of failing the apply.
                    type: boolean
                  interval:
                    description: Interval at which the operator re-reconciles this
                      kustomization.
                    type: string
                  patches:
                    description: |-
                      Patches is a list of strategic merge or JSON6902 patches to apply
                      on top of the kustomization output before sending to the cluster.
                    items:
                      description: KustomizePatch defines an inline strategic merge
                        or JSON6902 patch.
                      properties:
                        patch:
                          description: Patch is the inline YAML patch content.
                          minLength: 1
                          type: string
                        target:
                          description: |-
                            Target selects which resources to apply the patch to.
                            If not set, the patch is applied to all matching resources.
                          properties:
                            annotationSelector:
                              description: |-
                                AnnotationSelector filters resources by annotations
                                (e.g. "config.kubernetes.io/managed-by=kustomize").
                              type: string
                            group:
                              description: Group is the API group of the target resource.
                              type: string
                            kind:
                              description: Kind is the kind of the target resource.
                              type: string
                            labelSelector:
                              description: LabelSelector filters resources by labels
                                (e.g. "app=nginx").
                              type: string
                            name:
                              description: Name of the target resource.
                              type: string
                            namespace:
                              description: Namespace of the target resource.
                              type: string
                            version:
                              description: Version is the API version of the target
                                resource.
                              type: string
                          type: object
                      required:
                      - patch
                      type: object
                    type: array
                  path:
                    description: |-
                      Path is the directory path within the repository where
                      kustomization.yaml is located. Defaults to the repository root.
                    type: string
                  prune:
                    description: |-
                      Prune enables garbage collection: resources that were previously
                      applied but are no longer present in the kustomization output
                      will be deleted from the cluster.
                    type: boolean
                  ref:
                    description: |-
                      Ref specifies the Git reference to check out.
                      If not set, the default branch (usually main) is used.
                    properties:
                      branch:
                        description: Branch is the Git branch to check out.
                        type: string
                      commit:
                        description: Commit is the Git commit SHA to check out.
                        pattern: ^[a-f0-9]{7,40}$
                        type: string
                      semver:
                        description: |-
                          Semver is a semver range expression used to select the latest
                          matching Git tag.
                        type: string
                      tag:
                        description: Tag is the Git tag to check out.
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: at most one of branch, tag, commit, or semver may be
                        set
                      rule: '[has(self.branch), has(self.tag), has(self.commit), has(self.semver)].filter(x,
                        x).size() <= 1'
                  secretRef:
                    description: |-
                      SecretRef references a Secret containing credentials for the Git
                      repository. Supported keys: username + password (HTTPS), identity +
                      identity.pub + known_hosts (SSH).
                    properties:
                      name:
                        description: Name is the name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  targetNamespace:
                    description: |-
                      TargetNamespace overrides the namespace for all resources in the
                      kustomization output. If empty, each resource keeps its own namespace.
                    maxLength: 63
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?)$
                    type: string
                  timeout:
                    description: |-
                      Timeout is the maximum duration for the build and apply operation.
                      Defaults to 5m if not specified.
                    type: string
                  url:
                    description: |-
                      URL is the Git repository URL containing the kustomization.
                      Supports HTTPS and SSH URLs.
                    minLength: 1
                    pattern: ^(https?://|git@|ssh://).+$
                    type: string
                required:
                - interval
                - url
                type: object
              namespace:
                description: |-
                  Namespace is the default target namespace where resources will be
                  deployed when a Module is instantiated from this class.
                maxLength: 63
                minLength: 1
                pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?)$
                type: string
            required:
            - namespace
            type: object
            x-kubernetes-validations:
            - message: exactly one of helmChart or kustomization must be set
              rule: (has(self.helmChart) && !has(self.kustomization)) || (!has(self.helmChart)
                && has(self.kustomization))
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
