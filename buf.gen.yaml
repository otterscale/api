version: v2
plugins:
  - remote: buf.build/protocolbuffers/go
    out: .
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: .
    opt:
      - paths=source_relative
      - package_suffix
      - simple
  - remote: buf.build/community/sudorandom-connect-openapi:v0.25.3
    out: .
    opt:
      - path=openapi.yaml,short-operation-ids,short-service-tags